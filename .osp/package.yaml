# Package identity, content, dependencies, presentation metadata and the
# runtime projections (ADR B). The Claude package files and the Agent
# Plugins package are rendered from this file by build-kit's osp.py
# render; the gate fails on a hand edit to any of them.
#
# A computation is a skill (ADR E): the content is the two attested
# computations this capability owns, each concept under knowledge/ with
# its executor, attester and loaders in the scripts of the skill that
# runs it, the stamped data roots beside them as data, the three receipt
# skills over their receipts, and the goldens that prove every script.
# The dependency below stays because the dataset, convention, gotcha and
# recipe concepts about the CERES products are the provider bundle's and
# are cited, never copied; the floor is unchanged, because nothing this
# capability runs comes from that bundle any more.
schema_version: 1
package:
  name: atmospheric-physics
  version: 0.1.0
  type: capability
content:
  skills: ./skills
  knowledge: ./knowledge
  verification: ./verification
dependencies:
  capabilities:
  - name: core
  knowledge:
  - name: nasa-daac-knowledge
    version: '>=2026.9.4'
metadata:
  description: 'Atmospheric physics: the attested radiation budget computations over the CERES EBAF
    products, the energy budget closure against the Argo ocean heat content receipt and the cloud radiative
    effect at the top of the atmosphere, each with its executor, its attester and its golden.'
  keywords:
  - atmospheric-physics
  - atmosphere
  - radiation-budget
  - ceres
  - ebaf
  - asdc
  - energy-budget
  - earth-energy-imbalance
  - cloud-radiative-effect
  - clear-sky
  - attested-computation
