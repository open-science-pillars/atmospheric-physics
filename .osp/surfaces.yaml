# Runtime support policy (ADR B). `required` is what a release must qualify
# on before it advertises the surface; `status` is the evidence today.
#
# A runtime is advertised as supported only on a qualified record for the
# exact version and release lock. Claude Code has one for 0.1.0; the two
# other required surfaces are waived for this release, in writing, in
# .osp/qualification/, and are not advertised.
schema_version: 1
surfaces:
  claude-code:
    role:
    - development
    - runtime
    required: true
    status: supported
    evidence: 'Qualified for 0.1.0 by a headless run of the full matrix on Claude Code from a release-candidate
      catalog, recorded in .osp/qualification/claude-code.json against the release lock: installed with both
      dependencies, both skills discovered and invoked, the golden green on the installed tree, and the prove
      receipt attested'
  claude-cowork:
    role: runtime
    required: true
    status: planned
    evidence: The Claude projection (.claude-plugin/plugin.json) is rendered from package.yaml and passes
      osp.py validate in the gate; no install of this capability from the marketplace has been verified,
      because the catalog entry is cut with the release
  openai-codex:
    role: runtime
    required: true
    status: planned
    evidence: The Agent Plugins projection (plugin.json) is rendered from package.yaml and passes osp.py
      plugin-check in the gate; Codex qualification of a release has not run
  claude-science:
    role: future-runtime
    required: false
    status: limited-release
qualification:
  require:
  - install
  - skill-discovery
  - skill-invocation
  - knowledge-resolution
  - dependency-resolution
  - golden-computation
  - prove
  - receipt
  - release-lock
probes:
  skill-invocation:
    skill: energy-budget-closure
    prompt: Close the Earth's energy budget over 2006 through 2020 from the CERES EBAF net top-of-atmosphere
      flux and the Argo ocean heat content receipt, and show me the plan before anything is run.
    # A skill that computes something says whose computation it is, and
    # since the move this one is this package's: the expectation is the
    # concept's path here and the ocean side's provenance, which the skill
    # must state before any run, and a plan that omitted either would be the
    # failure worth catching.
    expect:
    - knowledge/computations/energy-budget[.]md
    - receipt
  prove:
    prompt: 'Run this capability''s fixture golden on the energy budget computation''s synthetic fixture
      and report the verdict and the residual it prints. The command is: uv run ${PLUGIN_ROOT}/verification/wrapped_computations.py
      --runtime ${RUNTIME} --out ${WORK}/receipt.json'
    receipt: ${WORK}/receipt.json
    command:
    - uv
    - run
    - ${PLUGIN_ROOT}/verification/wrapped_computations.py
    - --attest
    - ${WORK}/receipt.json
    - --out
    - ${WORK}/attestation.json
    attestation: ${WORK}/attestation.json
  golden-computation:
  - verification/wrapped_computations.py
