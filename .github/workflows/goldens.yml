name: goldens
# The goldens under verification/, each named here with the command that
# runs it.
#
# verification/energy_budget_chain.py and
# verification/cloud_radiative_effect_chain.py are the chains the
# provider bundle's check routine ran before the computations moved
# here: for each, the attester's selftest, both loaders' selftests, the
# executor on its synthetic fixture, the attester on the receipt, the
# receipt against the values the concept records, the chain's refusal
# case, the committed data root's manifest check and the anchored
# real-data run attested against the tree. The cloud radiative effect
# golden also runs the eight regions on both clear-sky conventions and
# holds the sign reversal of the convention difference over the polar
# bands. Both read the executors, the attesters, the concepts and the
# data roots of this package, need no credential, carry no secret and
# reach no live service.
#
# verification/wrapped_computations.py exercises both chains' fixture
# runs the way a skill runs them: the executor on its fixture, the
# attester on the receipt, the receipt against the values the concept
# records, and the chain's refusal case. The expectations it reads are
# committed under verification/fixtures/ (provenance in the README
# there). It is also the release qualification surface
# (.osp/surfaces.yaml) and runs there with the qualification prompts.
#
# verification/receipt_skills.py exercises sweep, receipt-figures and
# methods, the three skills here that compute nothing: each script's
# own selftest, three fixture sweeps whose every cell is checked
# against the committed
# expectations under verification/fixtures/ and against the field of
# the receipt it was copied from, three figures whose every drawn array
# is checked against the receipt field the expectations name for it,
# two methods paragraphs filled from the recorded receipt fields, and
# the refusals each script enforces, the aggregate across the two
# clear-sky conventions among them. No bit-exact digest of a derived
# float is recorded or asserted, because a window mean is not
# bit-reproducible across interpreters.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: plugin
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: The energy budget chain passes offline on the committed root
        run: uv run verification/energy_budget_chain.py
      - name: The cloud radiative effect chain passes offline on the committed root
        run: uv run verification/cloud_radiative_effect_chain.py
      - name: Both fixture chains pass offline on the committed expectations
        run: uv run verification/wrapped_computations.py
      - name: Sweep, receipt-figures and methods pass offline on the committed expectations
        run: uv run verification/receipt_skills.py
